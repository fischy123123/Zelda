# Generate audio for Aurelia with ElevenLabs, entirely from the GitHub website
# — no local checkout or terminal needed.
#
# One-time setup:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: ELEVENLABS_API_KEY     Secret: your sk_... key
#
# To run:
#   Actions tab → "Generate audio" → Run workflow
#
# Leave "dry_run" checked the first time: it reports what each generator would
# do and what it would cost, without spending anything.

name: Generate audio

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'What to generate'
        type: choice
        default: voices
        options:
          - voices
          - sound effects
          - music
          - voices + sound effects
          - everything
      dry_run:
        description: 'Preview only — report cost, generate nothing'
        type: boolean
        default: true
      force:
        description: 'Regenerate everything, even unchanged items'
        type: boolean
        default: false
      only:
        description: 'Limit to one item (e.g. bram, sword1, village)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the API key is present
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::No ELEVENLABS_API_KEY secret found."
            echo "Add it under Settings > Secrets and variables > Actions,"
            echo "with the name ELEVENLABS_API_KEY."
            exit 1
          fi
          echo "API key found."

      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          WHAT: ${{ inputs.what }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi

          run_one () {
            echo ""
            echo "=============================================="
            echo " $1"
            echo "=============================================="
            node "$2" $ARGS 2>&1 | tee -a run.log || echo "(that generator stopped early — see above)"
          }

          # Tracks come back at wildly different loudness; even them out so no
          # mood is twice as loud as the next. Best-effort: needs a browser to
          # decode mp3, and the music is still usable without it.
          normalize_music () {
            if [ "${{ inputs.dry_run }}" = "true" ]; then return 0; fi
            echo "" | tee -a run.log
            echo "--- Normalizing music levels ---" | tee -a run.log
            npm i -D playwright >/dev/null 2>&1 || true
            npx playwright install --with-deps chromium >/dev/null 2>&1 || true
            node tools/normalize-music.mjs 2>&1 | tee -a run.log \
              || echo "(normalization skipped — tracks keep their default trim)" | tee -a run.log
          }

          : > run.log
          case "$WHAT" in
            "voices")               run_one "Voices"        tools/gen-voices.mjs ;;
            "sound effects")        run_one "Sound effects" tools/gen-sfx.mjs ;;
            "music")
              run_one "Music"         tools/gen-music.mjs
              normalize_music ;;
            "voices + sound effects")
              run_one "Voices"        tools/gen-voices.mjs
              run_one "Sound effects" tools/gen-sfx.mjs ;;
            "everything")
              run_one "Voices"        tools/gen-voices.mjs
              run_one "Sound effects" tools/gen-sfx.mjs
              run_one "Music"         tools/gen-music.mjs
              normalize_music ;;
          esac

          {
            echo '## Audio generation'
            echo '```'
            cat run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f run.log

      - name: Commit the audio
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Nothing changed — everything was already generated."
            exit 0
          fi
          git add assets
          git commit -m "Generate audio pack (ElevenLabs)"
          # Re-stamp so every module and asset busts cache together.
          node tools/stamp-version.mjs
          if [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git commit -m "Re-stamp version for new audio"
          fi
          git push
          echo "Pushed. Reload the game to hear it." >> "$GITHUB_STEP_SUMMARY"
